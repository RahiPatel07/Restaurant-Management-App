<template>
    <div class="menu-page slds-grid slds-gutters">
        <!-- Left: Menu Sections -->
        <div class="slds-col slds-size_2-of-3">
            <div class="slds-card">
                <div class="slds-card__header slds-grid slds-grid_vertical-align-center slds-p-around_small">
                    <div class="slds-media__body">
                        <h2 class="slds-text-heading_medium">Menu</h2>
                    </div>
                </div>
                <div class="slds-card__body slds-p-horizontal_small">
                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-combobox
                                label="Restaurant"
                                value={selectedRestaurantId}
                                options={restaurantOptions}
                                placeholder="Select a restaurant"
                                onchange={handleRestaurantChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-combobox
                                label="Table"
                                value={selectedTableId}
                                options={tableOptions}
                                placeholder="Select a table"
                                onchange={handleTableChange}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <!-- Category Tabs -->
                    <div class="slds-button-group" role="group">
                        <button class={appetizersTabClass} onclick={handleCategoryClick} data-category="Appetizer">Appetizers</button>
                        <button class={entreesTabClass} onclick={handleCategoryClick} data-category="Entree">Entrees</button>
                        <button class={dessertsTabClass} onclick={handleCategoryClick} data-category="Dessert">Desserts</button>
                    </div>

                    <!-- Food Type Filters -->
                    <div class="slds-m-top_small">
                        <span class="slds-text-body_small slds-m-right_small">Food Type:</span>
                        <lightning-button-group>
                            <lightning-button
                                label="Vegetarian"
                                variant={vegVariant}
                                data-type="Vegetarian"
                                onclick={handleFoodTypeClick}>
                            </lightning-button>
                            <lightning-button
                                label="Non-Vegetarian"
                                variant={nonVegVariant}
                                data-type="Non-Vegetarian"
                                onclick={handleFoodTypeClick}>
                            </lightning-button>
                            <lightning-button
                                label="Vegan"
                                variant={veganVariant}
                                data-type="Vegan"
                                onclick={handleFoodTypeClick}>
                            </lightning-button>
                        </lightning-button-group>
                    </div>

                    <!-- Menu Items List -->
                    <template if:true={displayedMenuItems}>
                        <div class="slds-m-top_medium">
                            <template for:each={displayedMenuItems} for:item="item">
                                <div key={item.id} class="menu-item-row slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                                    <div class="slds-col slds-size_3-of-5">
                                        <div class="slds-text-title_bold">
                                            {item.name}
                                            <template if:true={item.isTopSeller}>
                                                <span class="top-seller-star" title="Top Seller">*</span>
                                            </template>
                                        </div>
                                        <div class="slds-text-body_small">
                                            {item.category} • {item.foodType}
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-5 slds-text-align_right">
                                        <span class="slds-text-title">${item.price}</span>
                                    </div>
                                    <div class="slds-col slds-size_1-of-5 slds-text-align_right">
                                        <lightning-button-icon
                                            icon-name="utility:dash"
                                            alternative-text="Decrease"
                                            onclick={decreaseQuantity}
                                            data-id={item.id}>
                                        </lightning-button-icon>
                                        <span class="slds-p-horizontal_small">
                                            {item.selectedQty}
                                        </span>
                                        <lightning-button-icon
                                            icon-name="utility:add"
                                            alternative-text="Increase"
                                            onclick={increaseQuantity}
                                            data-id={item.id}>
                                        </lightning-button-icon>
                                        <lightning-button
                                            class="slds-m-left_small"
                                            label="Add"
                                            variant="brand"
                                            size="small"
                                            onclick={addToCart}
                                            data-id={item.id}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:false={menuItems}>
                        <div class="slds-m-top_medium slds-text-color_weak">No items to display.</div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Right: Cart and Billed Items -->
        <div class="slds-col slds-size_1-of-3">
            <div class="slds-card">
                <div class="slds-card__header slds-grid slds-grid_vertical-align-center slds-p-around_small">
                    <div class="slds-media__body">
                        <h2 class="slds-text-heading_medium">Cart &amp; Bill</h2>
                    </div>
                </div>
                <div class="slds-card__body slds-p-horizontal_small">
                    <template if:true={message}>
                        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_small" role="status">
                            <span class="slds-assistive-text">Info</span>
                            <h2>{message}</h2>
                        </div>
                    </template>
                    <!-- Cart -->
                    <h3 class="slds-text-title_caps slds-m-top_small">Cart</h3>
                    <template if:true={hasCartItems}>
                        <template for:each={cartItems} for:item="line">
                            <div key={line.id} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                                <div class="slds-col slds-size_3-of-5">
                                    <div class="slds-text-title_bold">{line.menuItemName}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-5 slds-text-align_right">
                                    x {line.quantity}
                                </div>
                                <div class="slds-col slds-size_1-of-5 slds-text-align_right">
                                    ${line.lineTotal}
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasCartItems}>
                        <div class="slds-text-color_weak slds-m-vertical_small">Cart is empty.</div>
                    </template>

                    <!-- Billed Items -->
                    <h3 class="slds-text-title_caps slds-m-top_medium">Billed Items</h3>
                    <template if:true={hasBilledItems}>
                        <template for:each={billedItems} for:item="line">
                            <div key={line.id} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                                <div class="slds-col slds-size_3-of-5">
                                    <div class="slds-text-title_bold">{line.menuItemName}</div>
                                    <div class="slds-text-body_small">Status: {line.status}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-5 slds-text-align_right">
                                    <template if:true={line.isConfirmed}>
                                        <lightning-button-icon
                                            icon-name="utility:dash"
                                            alternative-text="Decrease"
                                            onclick={handleDecreaseConfirmed}
                                            data-id={line.id}>
                                        </lightning-button-icon>
                                        <span class="slds-p-horizontal_x-small">x {line.quantity}</span>
                                        <lightning-button-icon
                                            icon-name="utility:add"
                                            alternative-text="Increase"
                                            onclick={handleIncreaseConfirmed}
                                            data-id={line.id}>
                                        </lightning-button-icon>
                                    </template>
                                    <template if:false={line.isConfirmed}>
                                        x {line.quantity}
                                    </template>
                                </div>
                                <div class="slds-col slds-size_1-of-5 slds-text-align_right">
                                    ${line.lineTotal}
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasBilledItems}>
                        <div class="slds-text-color_weak slds-m-vertical_small">No billed items yet.</div>
                    </template>

                    <!-- Totals -->
                    <div class="slds-m-top_medium">
                        <div class="slds-grid slds-grid_align-spread">
                            <span>Subtotal</span>
                            <span>${subtotal}</span>
                        </div>
                        <div class="slds-grid slds-grid_align-spread">
                            <span>Tax</span>
                            <span>${tax}</span>
                        </div>
                        <div class="slds-grid slds-grid_align-spread slds-text-title_bold slds-m-top_x-small">
                            <span>Total</span>
                            <span>${grandTotal}</span>
                        </div>
                        <template if:true={etaMinutes}>
                            <div class="slds-text-body_small slds-m-top_x-small">
                                Estimated time for first item: {etaMinutes} min
                            </div>
                        </template>
                    </div>

                    <!-- Actions -->
                    <div class="slds-m-top_medium slds-grid slds-grid_align-spread">
                        <lightning-button
                            label="Reset Cart"
                            onclick={handleResetCart}
                            variant="neutral">
                        </lightning-button>
                        <lightning-button
                            label="Place Order"
                            onclick={handlePlaceOrder}
                            variant="brand"
                            disabled={disablePlaceOrder}>
                        </lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
